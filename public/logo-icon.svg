<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="kxWaveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="100%" stop-color="#0066FF" />
    </linearGradient>
    <linearGradient id="kxBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1527" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    <filter id="kxGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Fundo Escuro -->
  <rect width="512" height="512" rx="120" fill="url(#kxBgGrad)" />
  <rect width="510" height="510" x="1" y="1" rx="119" stroke="rgba(255,255,255,0.08)" stroke-width="2" />

  <!-- Símbolo Contactless / Wi-Fi Konnexy Tap -->
  <g filter="url(#kxGlow)">
    <!-- Onda Superior (Mais Ampla) -->
    <path
      d="M 120 200 A 180 180 0 0 1 392 200"
      stroke="url(#kxWaveGrad)"
      stroke-width="36"
      stroke-linecap="round"
      fill="none"
    />
    <!-- Onda Média -->
    <path
      d="M 168 256 A 120 120 0 0 1 344 256"
      stroke="url(#kxWaveGrad)"
      stroke-width="36"
      stroke-linecap="round"
      fill="none"
    />
    <!-- Onda Inferior -->
    <path
      d="M 216 312 A 60 60 0 0 1 296 312"
      stroke="url(#kxWaveGrad)"
      stroke-width="34"
      stroke-linecap="round"
      fill="none"
    />
    <!-- Ponto Central -->
    <circle
      cx="256"
      cy="364"
      r="20"
      fill="url(#kxWaveGrad)"
    />
  </g>
</svg>
