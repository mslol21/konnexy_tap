<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" fill="none">
  <defs>
    <linearGradient id="kxWaveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="100%" stop-color="#0066FF" />
    </linearGradient>
  </defs>

  <!-- Símbolo Superior Contactless / Wi-Fi -->
  <g transform="translate(300, 105)">
    <!-- Onda Superior -->
    <path
      d="M -75 -40 A 85 85 0 0 1 75 -40"
      stroke="url(#kxWaveGrad)"
      stroke-width="16"
      stroke-linecap="round"
      fill="none"
    />
    <!-- Onda Média -->
    <path
      d="M -48 -12 A 56 56 0 0 1 48 -12"
      stroke="url(#kxWaveGrad)"
      stroke-width="16"
      stroke-linecap="round"
      fill="none"
    />
    <!-- Onda Inferior -->
    <path
      d="M -22 14 A 26 26 0 0 1 22 14"
      stroke="url(#kxWaveGrad)"
      stroke-width="14"
      stroke-linecap="round"
      fill="none"
    />
    <!-- Ponto Central -->
    <circle
      cx="0"
      cy="38"
      r="8.5"
      fill="url(#kxWaveGrad)"
    />
  </g>

  <!-- Logotipo: Konnexy Tap -->
  <text x="300" y="240" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <tspan font-weight="900" font-size="64" fill="#FFFFFF" letter-spacing="-1">Konnexy </tspan>
    <tspan font-weight="900" font-style="italic" font-size="64" fill="url(#kxWaveGrad)" letter-spacing="-1">Tap</tspan>
  </text>

  <!-- Tagline: CONEXÕES QUE GERAM RESULTADOS -->
  <text
    x="300"
    y="278"
    text-anchor="middle"
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
    font-size="14.5"
    font-weight="700"
    letter-spacing="5"
    fill="#94A3B8"
  >
    CONEXÕES QUE GERAM RESULTADOS
  </text>
</svg>
